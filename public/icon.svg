<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Glass Decorative Panel -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Glowing Accent Ring Top Right -->
  <circle cx="396" cy="116" r="28" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="396" cy="116" r="14" fill="#ffffff" />

  <!-- Monogram Logo "AT" -->
  <g transform="translate(112, 148)">
    <!-- Letter A -->
    <path d="M 72 216 L 144 24 L 216 216 L 168 216 L 144 148 L 96 148 L 72 216 Z M 110 110 L 144 48 L 178 110 Z" fill="#ffffff" />
    
    <!-- Letter T styled with accent bar -->
    <path d="M 216 24 L 288 24 L 288 64 L 268 64 L 268 216 L 236 216 L 236 64 L 216 64 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Subtitle Tag: HRIS -->
  <rect x="180" y="380" width="152" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2" />
  <text x="256" y="403" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#10b981" letter-spacing="4">ENTERPRISE</text>
</svg>
